name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Unit + integration tests
        run: pytest --cov=codeformer --cov-report=xml --cov-report=term-missing --cov-fail-under=85
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage-xml
          path: coverage.xml

  smoke-e2e:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[serve]"
      - name: Train -> evaluate -> predict -> finetune on synthetic data
        run: |
          python scripts/make_sample_data.py --out /tmp/data --n-train 800 --n-val 100 --n-realtime 60
          printf 'model: {n_layers: 2, n_heads: 2, d_model: 64, d_ff: 128, max_seq_len: 32, n_future: 6}\ntrain: {epochs: 6, batch_size: 32, lr: 0.003}\n' > /tmp/ci.yaml
          codeformer train --config /tmp/ci.yaml --train /tmp/data/train.csv --val /tmp/data/val.csv --out /tmp/model.pt
          codeformer evaluate --checkpoint /tmp/model.pt --data /tmp/data/val.csv
          codeformer predict --checkpoint /tmp/model.pt --text "l1k01 l2k01 parcel" --top-k 3
          codeformer finetune --checkpoint /tmp/model.pt --data /tmp/data/realtime.jsonl --replay /tmp/data/train.csv --epochs 1 --out /tmp/model2.pt

  docker:
    needs: [test, smoke-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: codeformer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test (no model mounted => degraded but alive)
        run: |
          docker run -d --name cf -p 8000:8000 codeformer:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          curl -sf http://localhost:8000/health | grep -q '"model_loaded":false'
          docker logs cf
          docker rm -f cf
